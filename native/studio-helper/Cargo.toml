[package]
name = "sentry-studio-helper"
version = "1.0.0"
description = "Native helper for Sentry Studio: drive-data.json loading and SEI telemetry extraction"
authors = ["Sentry-Six"]
license = "MIT"
edition = "2021"
rust-version = "1.80"
publish = false

[[bin]]
name = "sentry-studio-helper"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: parse every number to the exact double JavaScript's
# JSON.parse gives (the default parser can be off by one ulp).
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
anyhow = "1"
chrono = "0.4"
base64 = "0.22"
libm = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
