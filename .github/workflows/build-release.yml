name: Build Release

# Builds Sentry Studio for macOS, Windows and Linux when a GitHub release is
# published (attaching the builds to it), or by hand from the Actions tab.
# Signing (none of it needed for a build to succeed):
#   macOS:   MAC_CERTIFICATE_P12, MAC_CERTIFICATE_PASSWORD (Developer ID) and
#            APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER (notarization)
#   Windows: Azure Artifact Signing, signed in with OIDC (no secret) in the
#            windows-signing environment: the repository variables
#            AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
#            ARTIFACT_SIGNING_ENDPOINT, ARTIFACT_SIGNING_ACCOUNT and
#            ARTIFACT_SIGNING_PROFILE
# Updates: installed copies, including Electron Studio's electron-updater,
# update from the release's latest.yml, latest-mac.yml and latest-linux.yml
# (electron-builder's format). Each is attached after the files it lists, so
# an updater never sees a manifest before its file.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      bundle-id:
        description: macOS bundle identifier (releases use com.sentry-six.revamped)
        required: false
        default: com.sentry-six.revamped.dev

permissions:
  contents: write

jobs:
  populate-release-notes:
    # Auto-fill the GitHub Release body from changelog.json so published releases
    # match the formatting used by the DevTool (✦ feature, ↑ improvement, ✓ fix).
    # Only runs on a real release event, and only overwrites when the body is empty
    # so manually-authored notes are never clobbered.
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fill release notes from changelog.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # Strip leading v and any -rc* / -beta* suffix so pre-release tags still
          # match their base changelog entry (v2026.17.26-rc1 → 2026.17.26).
          VERSION="${TAG#v}"
          BASE_VERSION="${VERSION%%-*}"

          CURRENT_BODY=$(gh release view "$TAG" --json body --jq .body)
          if [ -n "$CURRENT_BODY" ]; then
            echo "Release already has notes — skipping auto-fill."
            exit 0
          fi

          # Find the last stable release (not a prerelease, not the current tag).
          # Any changelog.json entries between it and the current version are
          # "unreleased" drafts we roll forward into this release's notes.
          LAST_RELEASED=$(gh release list --limit 50 --json tagName,isPrerelease \
            --jq "[.[] | select(.tagName != \"$TAG\" and .isPrerelease == false) | .tagName] | first // \"\"")
          LAST_VERSION="${LAST_RELEASED#v}"
          LAST_VERSION="${LAST_VERSION%%-*}"
          echo "Last stable release: ${LAST_RELEASED:-(none)}  →  version for comparison: ${LAST_VERSION:-(none)}"

          BODY=$(jq -r \
            --arg cur_v "$BASE_VERSION" \
            --arg last_v "$LAST_VERSION" \
            '
            def icon:
              if . == "feature" then "✦"
              elif . == "improvement" then "↑"
              elif . == "fix" then "✓"
              else "•" end;
            def as_ver: split(".") | map(tonumber);

            ($cur_v | as_ver) as $curV
            | (if $last_v == "" then [0,0,0] else ($last_v | as_ver) end) as $lastV
            | . as $root
            | (
                # Current version: its own changes, no header
                [
                  $root.versions[]
                  | select(.version == $cur_v)
                  | .changes[]
                  | "\(.type | icon) \(.description)"
                ] | join("\n")
              ) as $cur_block
            | [
                # Intermediate never-released versions, each with a header
                $root.versions[]
                | select(
                    (.version | as_ver) < $curV
                    and (.version | as_ver) > $lastV
                  )
                | "\n### From v\(.version)\(if ((.title // "") != "") then " — " + .title else "" end)\n" +
                  ([.changes[] | "\(.type | icon) \(.description)"] | join("\n"))
              ] as $inter_blocks
            | ([$cur_block] + $inter_blocks) | join("\n")
            ' changelog.json)

          if [ -z "$BODY" ]; then
            echo "No changelog entries to publish for $BASE_VERSION — leaving release notes empty."
            exit 0
          fi

          # The code signing policy: who signs the Windows builds, and how.
          BODY="$BODY"$'\n\n'"[Code signing policy](https://sentry-six.com/code-signing)"
          printf '%s\n' "$BODY" | gh release edit "$TAG" --notes-file -
          echo "Release notes populated for $TAG (current: $BASE_VERSION, since last stable: ${LAST_VERSION:-none})."

  mac:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      HAS_MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE_P12 != '' }}
      HAS_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Set up the Developer ID certificate
        if: env.HAS_MAC_CERTIFICATE == 'true'
        env:
          MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$MAC_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN_PATH" -P "$MAC_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm -f "$RUNNER_TEMP/certificate.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          test -n "$IDENTITY"
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Set up notarization
        if: env.HAS_APPLE_API_KEY == 'true'
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p "$HOME/private_keys"
          echo "$APPLE_API_KEY_B64" | base64 --decode > "$HOME/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "APPLE_API_KEY=$HOME/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          BUNDLE_ID: ${{ inputs.bundle-id || 'com.sentry-six.revamped' }}
        run: tools/package-macos.sh

      # Squirrel.Mac installs the app from the .zip only if it is validly
      # signed by the installed app's team, under its bundle identifier.
      - name: Check the update zip
        if: env.HAS_MAC_CERTIFICATE == 'true'
        run: |
          CHECK="$RUNNER_TEMP/zip-check"
          rm -rf "$CHECK" && mkdir -p "$CHECK"
          ditto -x -k target/macos/SentryStudio-*-macOS.zip "$CHECK"
          codesign --verify --deep --strict --verbose=2 "$CHECK/Sentry Studio.app"
          codesign -dv --verbose=2 "$CHECK/Sentry Studio.app" 2>&1 | grep -E "^(Identifier|TeamIdentifier|Authority)="
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            codesign -dv "$CHECK/Sentry Studio.app" 2>&1 | grep -qx "Identifier=com.sentry-six.revamped"
          fi
          if [ "$HAS_APPLE_API_KEY" = true ]; then
            xcrun stapler validate "$CHECK/Sentry Studio.app"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          retention-days: 30
          path: |
            target/macos/*.dmg
            target/macos/*.zip
            target/macos/latest-mac.yml

      # latest-mac.yml only for a Developer ID build: an installed copy would
      # download an ad hoc signed one and fail to install it.
      - name: Attach to the GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" target/macos/*.dmg target/macos/*.zip --clobber
          if [ "$HAS_MAC_CERTIFICATE" = true ]; then
            gh release upload "$TAG" target/macos/latest-mac.yml --clobber
          else
            echo "::warning::No Developer ID certificate: latest-mac.yml is not attached, so installed copies won't update to this build."
          fi

  windows:
    # Cross-compiled with mingw-w64, the same build that's tested locally, the
    # installer built with Ubuntu's NSIS, and both signed with Azure Artifact
    # Signing through jsign. Attached to the release by windows-installer
    # once it has installed on Windows.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The Azure app's federated credential trusts this environment's OIDC
    # token (repo:Sentry-Six/Sentry-Six:environment:windows-signing), and the
    # job waits for one of its required reviewers to approve it.
    # Only a release tag signs: a run by hand from a branch builds unsigned,
    # outside the environment (whose deployment rule allows only v* tags).
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'windows-signing' || '' }}
    permissions:
      contents: read
      id-token: write
    env:
      # Without the Azure variables (a fork, say) or a release tag, the build
      # is unsigned.
      HAS_SIGNING: ${{ startsWith(github.ref, 'refs/tags/v') && vars.AZURE_CLIENT_ID != '' && vars.ARTIFACT_SIGNING_ACCOUNT != '' }}
      ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
      ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
      ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
      JSIGN_VERSION: '7.6'
      JSIGN_SHA256: 6cf58aa080e7ff82656f320cff8d4a3bff30408df8766806dcba3740dd839fa5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 nsis
          makensis -VERSION
          rustup target add x86_64-pc-windows-gnu

      - name: Read version
        id: version
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          cargo build --locked --release --target x86_64-pc-windows-gnu
          mkdir -p to-sign
          cp target/x86_64-pc-windows-gnu/release/sentry-studio.exe to-sign/

      - name: Sign in to Azure
        if: env.HAS_SIGNING == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # jsign signs Windows files on Linux (tools/sign-windows.sh).
      - name: Set up the signer
        if: env.HAS_SIGNING == 'true'
        run: |
          # Maven Central: the same jar as jsign's GitHub release (same
          # SHA-256), without depending on GitHub's release downloads.
          curl -sSfL -o "$RUNNER_TEMP/jsign.jar" "https://repo1.maven.org/maven2/net/jsign/jsign/$JSIGN_VERSION/jsign-$JSIGN_VERSION.jar"
          echo "$JSIGN_SHA256  $RUNNER_TEMP/jsign.jar" | sha256sum -c -
          echo "JSIGN_JAR=$RUNNER_TEMP/jsign.jar" >> "$GITHUB_ENV"
          java -version

      # The installer and uninstaller unpack NSIS's plugin DLLs (System,
      # nsExec, nsDialogs) to a temporary folder and run them, so they're
      # signed too: all of the Unicode plugins, in place, before any
      # installer is built.
      - name: Sign the installer's plugins
        if: env.HAS_SIGNING == 'true'
        run: |
          PLUGINS=/usr/share/nsis/Plugins/x86-unicode
          test -f "$PLUGINS/System.dll"
          mkdir -p "$RUNNER_TEMP/plugins"
          cp "$PLUGINS"/*.dll "$RUNNER_TEMP/plugins/"
          tools/sign-windows.sh "$RUNNER_TEMP"/plugins/*.dll
          sudo cp "$RUNNER_TEMP"/plugins/*.dll "$PLUGINS/"

      # NSIS writes the uninstaller into the installer, so a first installer
      # build only copies it out, to be signed with the app.
      - name: Sign the app and its uninstaller
        if: env.HAS_SIGNING == 'true'
        run: |
          SIGNED_EXE="$PWD/to-sign/sentry-studio.exe" CAPTURE_UNINSTALLER="$PWD/to-sign/uninstaller.exe" \
            REQUIRE_INSTALLER=1 tools/package-windows.sh
          test -f to-sign/uninstaller.exe
          tools/sign-windows.sh to-sign/sentry-studio.exe to-sign/uninstaller.exe

      - name: Package
        run: |
          if [ "$HAS_SIGNING" = true ]; then
            SIGNED_EXE="$PWD/to-sign/sentry-studio.exe" SIGNED_UNINSTALLER="$PWD/to-sign/uninstaller.exe" \
              REQUIRE_INSTALLER=1 tools/package-windows.sh
          else
            SIGNED_EXE="$PWD/to-sign/sentry-studio.exe" REQUIRE_INSTALLER=1 tools/package-windows.sh
          fi

      # Signing changes the installer, so latest.yml is written again for
      # the signed file.
      - name: Sign the installer
        if: env.HAS_SIGNING == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tools/sign-windows.sh "target/windows/SentryStudioSetup$VERSION.exe"
          python3 -I tools/update-manifest.py target/windows/latest.yml "$VERSION" "target/windows/SentryStudioSetup$VERSION.exe"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          retention-days: 30
          path: |
            target/windows/*.zip
            target/windows/SentryStudioSetup*.exe
            target/windows/latest.yml

  windows-installer:
    # Installs the installer on Windows the way electron-updater runs it, over
    # a stand-in for Electron Studio's install, uninstalls it, and only then
    # attaches it and latest.yml to the release.
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows
          path: dist

      - name: Install over Electron Studio, then uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Check($ok, $what) { if (-not $ok) { throw "FAILED: $what" } else { Write-Host "ok: $what" } }
          $setup = (Get-ChildItem dist\SentryStudioSetup*.exe | Select-Object -First 1).FullName
          $version = (Get-Content dist\latest.yml | Where-Object { $_ -match '^version: ' }) -replace '^version: ', ''
          $guid = 'cf7c37f6-3080-5f6d-a7fd-79b75b0fa971'
          $uninstallKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\$guid"
          $installKey = "HKCU:\Software\$guid"
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Sentry Studio'
          $programs = [Environment]::GetFolderPath('Programs')
          $startLink = Join-Path $programs 'Sentry Studio.lnk'

          # latest.yml describes this installer, as electron-updater checks it.
          $sha = [Convert]::ToBase64String([Security.Cryptography.SHA512]::Create().ComputeHash([IO.File]::ReadAllBytes($setup)))
          $yml = Get-Content -Raw dist\latest.yml
          Check ($yml.Contains("sha512: $sha")) 'latest.yml sha512'
          Check ($yml.Contains("size: $((Get-Item $setup).Length)")) 'latest.yml size'

          # A stand-in for Electron Studio as electron-builder installs it, and its settings.
          New-Item -ItemType Directory -Force "$dir\resources\app.asar.unpacked", "$dir\locales" | Out-Null
          foreach ($f in 'Sentry Studio.exe', 'Uninstall Sentry Studio.exe', 'chrome_100_percent.pak', 'resources.pak', 'ffmpeg.dll', 'electron_wer.dll', 'icudtl.dat', 'v8_context_snapshot.bin', 'locales\en-US.pak', 'resources\app.asar', 'resources\app-update.yml') {
            Set-Content -Path (Join-Path $dir $f) -Value 'electron'
          }
          Set-Content -Path (Join-Path $dir 'notes.txt') -Value 'the user''s own file'
          $appData = Join-Path $env:APPDATA 'Sentry Studio'
          New-Item -ItemType Directory -Force $appData | Out-Null
          Set-Content -Path "$appData\settings.json" -Value '{}'
          New-Item -Force $installKey | Out-Null
          Set-ItemProperty $installKey InstallLocation $dir
          New-Item -Force $uninstallKey | Out-Null
          Set-ItemProperty $uninstallKey UninstallString "`"$dir\Uninstall Sentry Studio.exe`" /currentuser"
          Set-ItemProperty $uninstallKey DisplayVersion '2026.45.39'
          $shell = New-Object -ComObject WScript.Shell
          $old = $shell.CreateShortcut($startLink); $old.TargetPath = "$dir\Sentry Studio.exe"; $old.Save()

          # As electron-updater runs it when the app quits.
          $p = Start-Process -Wait -PassThru -FilePath $setup -ArgumentList '--updated /S'
          Check ($p.ExitCode -eq 0) "installer exit code ($($p.ExitCode))"
          Check (Test-Path "$dir\sentry-studio.exe") 'sentry-studio.exe installed'
          Check (Test-Path "$dir\Uninstall Sentry Studio.exe") 'uninstaller installed'
          foreach ($f in 'Sentry Studio.exe', 'chrome_100_percent.pak', 'resources.pak', 'ffmpeg.dll', 'electron_wer.dll', 'icudtl.dat', 'v8_context_snapshot.bin', 'locales', 'resources') {
            Check (-not (Test-Path (Join-Path $dir $f))) "Electron's $f removed"
          }
          Check (Test-Path (Join-Path $dir 'notes.txt')) 'other files kept'
          Check (Test-Path "$appData\settings.json") 'settings kept'
          $u = Get-ItemProperty $uninstallKey
          Check ($u.DisplayVersion -eq $version) "DisplayVersion $($u.DisplayVersion)"
          Check ($u.DisplayName -eq 'Sentry Studio') 'DisplayName'
          Check ($u.UninstallString -eq "`"$dir\Uninstall Sentry Studio.exe`" /currentuser") 'UninstallString'
          Check ((Get-ItemProperty $installKey).InstallLocation -eq $dir) 'InstallLocation'
          Check ($shell.CreateShortcut($startLink).TargetPath -eq "$dir\sentry-studio.exe") 'Start menu shortcut points at the new app'
          Check (-not (Test-Path (Join-Path ([Environment]::GetFolderPath('Desktop')) 'Sentry Studio.lnk'))) 'no desktop shortcut added on an update'

          # The uninstaller, in place (_?=) so the step can wait for it.
          $p = Start-Process -Wait -PassThru -FilePath "$dir\Uninstall Sentry Studio.exe" -ArgumentList "/S _?=$dir"
          Check ($p.ExitCode -eq 0) "uninstaller exit code ($($p.ExitCode))"
          Check (-not (Test-Path "$dir\sentry-studio.exe")) 'app removed'
          Check (-not (Test-Path $uninstallKey)) 'uninstall key removed'
          Check (-not (Test-Path $installKey)) 'install key removed'
          Check (-not (Test-Path $startLink)) 'Start menu shortcut removed'
          Check (Test-Path "$appData\settings.json") 'settings kept after uninstalling'

          # A first install with the defaults.
          Remove-Item -Recurse -Force $dir
          $p = Start-Process -Wait -PassThru -FilePath $setup -ArgumentList '/S'
          Check ($p.ExitCode -eq 0) "fresh install exit code ($($p.ExitCode))"
          Check (Test-Path "$dir\sentry-studio.exe") 'fresh install in %LOCALAPPDATA%\Programs\Sentry Studio'
          Check (Test-Path (Join-Path ([Environment]::GetFolderPath('Desktop')) 'Sentry Studio.lnk')) 'desktop shortcut on a first install'

      # Every program in the download (the installer, each .exe or .dll in
      # the zip and in the installed copy, and the plugin DLLs the installer
      # and uninstaller unpack and run, read out with 7-Zip) must have a
      # valid, timestamped signature from Scott Vandereems:
      # sentry-six.com/code-signing says so. A release fails without; a run
      # by hand only reports.
      - name: Check the signatures
        shell: pwsh
        env:
          ENFORCE: ${{ github.event_name == 'release' }}
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'zip'
          Expand-Archive -Force (Get-ChildItem dist\*.zip | Select-Object -First 1).FullName $zip
          $installed = Join-Path $env:LOCALAPPDATA 'Programs\Sentry Studio'
          $setup = (Get-ChildItem dist\SentryStudioSetup*.exe | Select-Object -First 1).FullName
          $unpacked = Join-Path $env:RUNNER_TEMP 'unpacked'
          $bad = 0
          foreach ($exe in @(@($setup, 'installer'), @((Join-Path $installed 'Uninstall Sentry Studio.exe'), 'uninstaller'))) {
            & 7z x -y "-o$unpacked\$($exe[1])" $exe[0] | Out-Null
            if ($LASTEXITCODE -ne 0) { Write-Host "UNREADABLE: 7-Zip couldn't unpack the $($exe[1]) ($LASTEXITCODE)"; $bad++ }
          }
          $files = @(Get-ChildItem dist\SentryStudioSetup*.exe) +
            @(Get-ChildItem -Recurse -File $zip, $installed, $unpacked -Include *.exe, *.dll)
          $names = $files | ForEach-Object Name
          foreach ($expected in 'sentry-studio.exe', 'Uninstall Sentry Studio.exe', 'System.dll', 'nsExec.dll', 'nsDialogs.dll') {
            if ($names -notcontains $expected) { Write-Host "MISSING: $expected"; $bad++ }
          }
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature -LiteralPath $f.FullName
            $ok = $s.Status -eq 'Valid' -and $s.SignerCertificate.Subject -match '(^|, )CN=Scott Vandereems(,|$)' -and $null -ne $s.TimeStamperCertificate
            Write-Host ("{0} {1}: {2}, {3}, timestamp {4}" -f ($(if ($ok) { 'ok' } else { 'NOT SIGNED' })), $f.FullName, $s.Status, $s.SignerCertificate.Subject, ($null -ne $s.TimeStamperCertificate))
            if (-not $ok) { $bad++ }
          }
          if ($bad -gt 0) {
            if ($env:ENFORCE -eq 'true') { throw "$bad file(s) not signed as the code signing policy says" }
            Write-Host "::warning::$bad file(s) not signed (a run by hand, so not failing)"
          }

      - name: Attach to the GitHub release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" dist/*.zip dist/SentryStudioSetup*.exe --clobber
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" dist/latest.yml --clobber

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # zig links against glibc 2.28, so the binary runs on older distributions
      # than the runner's.
      # Zig (for cargo-zigbuild) from ziglang.org, checked against its
      # published SHA-256.
      - name: Set up Zig
        env:
          ZIG_VERSION: '0.17.0'
          ZIG_SHA256: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
        run: |
          curl -sSfL -o "$RUNNER_TEMP/zig.tar.xz" "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz"
          echo "$ZIG_SHA256  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-$ZIG_VERSION" >> "$GITHUB_PATH"
      # From crates.io: GitHub's release downloads (which install-action
      # uses) can time out.
      - name: Install cargo-zigbuild
        # The Rust cache can bring it back already installed.
        run: command -v cargo-zigbuild >/dev/null || cargo install --locked cargo-zigbuild --version 0.24.1
      - name: Set up Rust
        run: rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu

      # Both architectures, cross-compiled here (zig links either).
      - name: Build and package
        run: |
          ARCH=x64 tools/package-linux.sh
          ARCH=arm64 tools/package-linux.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          retention-days: 30
          path: |
            target/linux/*.deb
            target/linux/*.tar.gz
            target/linux/latest-linux*.yml

      # Each manifest after its .deb: Electron Studio's .deb updater reads
      # latest-linux.yml (x64) or latest-linux-arm64.yml (arm64).
      - name: Attach to the GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" target/linux/*.deb target/linux/*.tar.gz --clobber
          gh release upload "$TAG" target/linux/latest-linux.yml target/linux/latest-linux-arm64.yml --clobber
