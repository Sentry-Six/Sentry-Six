name: CI

# Fast validation for every push and PR: proves the repo installs cleanly, the
# Jest and renderer tests pass on Linux and macOS, and electron-builder can
# produce a packaged app on all three supported platforms.

on:
  push:
    branches: [main, Dev-SEI]
  pull_request:
    branches: [main, Dev-SEI]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Not on Windows yet: there the bundled ffmpeg.exe can run, so the real
      # encoder integration suite and the Windows-only file tests would run in
      # CI for the first time. Elsewhere the integration suite skips itself
      # with a SKIP message because the checkout has no macOS or Linux FFmpeg.
      - name: Run tests
        if: runner.os != 'Windows'
        run: |
          npm test
          npm run test:dashcam

      - name: Verify build setup
        # --dir produces an unpacked app without building the installer (much faster
        # than a full build) — enough to catch packaging config breaks, missing
        # files, and native-module issues.
        run: npx electron-builder --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
