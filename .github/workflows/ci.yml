name: CI

# Every push and pull request: the tests on macOS, and release builds for
# Windows (cross-compiled with mingw-w64, and its NSIS installer) and Linux
# (zig, glibc 2.28), the same way they're packaged. Compiled dependencies
# are cached between runs (Build Release always builds from scratch).

on:
  push:
    branches: [main, Dev-SEI]
  pull_request:
    branches: [main, Dev-SEI]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    # One set of flags for the build and the tests, so they share one compile.
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Build without warnings
        run: cargo build --release
      - name: Test
        run: cargo test --release
      # The licences shipped with the app must match its dependencies: after
      # a dependency change, run python3 -I tools/third-party-notices.py.
      - name: Check THIRD-PARTY-NOTICES.txt
        run: |
          cargo fetch --locked
          python3 -I tools/third-party-notices.py --check

  windows:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Set up the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 nsis
          rustup target add x86_64-pc-windows-gnu
      - name: Build
        run: RUSTFLAGS="-D warnings" cargo build --release --target x86_64-pc-windows-gnu
      - name: Build the installer
        run: SIGNED_EXE="$PWD/target/x86_64-pc-windows-gnu/release/sentry-studio.exe" REQUIRE_INSTALLER=1 tools/package-windows.sh

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      # Zig (for cargo-zigbuild) from ziglang.org, checked against its
      # published SHA-256.
      - name: Set up Zig
        env:
          ZIG_VERSION: '0.17.0'
          ZIG_SHA256: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
        run: |
          curl -sSfL -o "$RUNNER_TEMP/zig.tar.xz" "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz"
          echo "$ZIG_SHA256  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-$ZIG_VERSION" >> "$GITHUB_PATH"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Build
        run: |
          rustup target add x86_64-unknown-linux-gnu
          RUSTFLAGS="-D warnings" cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.28
