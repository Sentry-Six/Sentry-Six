name: Mac App Store

# Builds the Mac App Store version (tools/package-macos-app-store.sh: the
# app-store feature, sandboxed, no updater of its own) and uploads it to App
# Store Connect when a release becomes a full release, so pre-releases
# don't reach the App Store. It can also be run by hand from the Actions tab
# on a release tag, with or without uploading. The build number is the
# version (CFBundleVersion takes at most three numbers), so each version
# uploads once; uploading the same version again would be refused. Apple's review follows the
# upload; submitting the build for review is done in App Store Connect.
# Secrets:
#   MAS_APP_P12                the "3rd Party Mac Developer Application"
#                              certificate and key (.p12, base64)
#   MAS_INSTALLER_P12          the "3rd Party Mac Developer Installer" one
#   MAS_P12_PASSWORD           their password
#   MAS_PROVISIONING_PROFILE   the Mac App Store provisioning profile (base64)
#   APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER: the App Store Connect
#                              API key the release workflow notarizes with
#                              (its role must allow uploading builds)
on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to App Store Connect
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  app-store:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      READY: ${{ secrets.MAS_APP_P12 != '' && secrets.MAS_INSTALLER_P12 != '' && secrets.MAS_PROVISIONING_PROFILE != '' }}
    steps:
      - name: Without the App Store secrets
        if: env.READY != 'true'
        run: echo "::warning::The App Store secrets (MAS_APP_P12, MAS_INSTALLER_P12, MAS_PROVISIONING_PROFILE) aren't set, so there's no App Store build."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.READY == 'true'

      - name: Set up Rust
        if: env.READY == 'true'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Set up the App Store certificates and profile
        if: env.READY == 'true'
        env:
          MAS_APP_P12: ${{ secrets.MAS_APP_P12 }}
          MAS_INSTALLER_P12: ${{ secrets.MAS_INSTALLER_P12 }}
          MAS_P12_PASSWORD: ${{ secrets.MAS_P12_PASSWORD }}
          MAS_PROVISIONING_PROFILE: ${{ secrets.MAS_PROVISIONING_PROFILE }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-store.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          import_p12() {
            printf '%s' "$1" | base64 --decode > "$RUNNER_TEMP/app-store.p12"
            security import "$RUNNER_TEMP/app-store.p12" -k "$KEYCHAIN_PATH" -P "$MAS_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
            rm -f "$RUNNER_TEMP/app-store.p12"
          }
          import_p12 "$MAS_APP_P12"
          import_p12 "$MAS_INSTALLER_P12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          APP_IDENTITY=$(security find-identity -v "$KEYCHAIN_PATH" | sed -n 's/.*"\(\(3rd Party Mac Developer Application\|Apple Distribution\): .*\)"/\1/p' | head -1)
          INSTALLER_IDENTITY=$(security find-identity -v "$KEYCHAIN_PATH" | sed -n 's/.*"\(\(3rd Party Mac Developer Installer\|Mac Installer Distribution\): .*\)"/\1/p' | head -1)
          test -n "$APP_IDENTITY" && test -n "$INSTALLER_IDENTITY"
          echo "APP_IDENTITY=$APP_IDENTITY" >> "$GITHUB_ENV"
          echo "INSTALLER_IDENTITY=$INSTALLER_IDENTITY" >> "$GITHUB_ENV"
          echo "$MAS_PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/app-store.provisionprofile"
          echo "PROVISIONING_PROFILE=$RUNNER_TEMP/app-store.provisionprofile" >> "$GITHUB_ENV"

      # altool finds the key as ~/private_keys/AuthKey_<id>.p8.
      - name: Set up the App Store Connect key
        if: env.READY == 'true'
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p "$HOME/private_keys"
          echo "$APPLE_API_KEY_B64" | base64 --decode > "$HOME/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"

      - name: Build, sign and package (and upload)
        if: env.READY == 'true'
        env:
          UPLOAD: ${{ (github.event_name == 'release' || inputs.upload) && '1' || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: tools/package-macos-app-store.sh
