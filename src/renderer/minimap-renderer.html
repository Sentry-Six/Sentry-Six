<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Minimap Renderer</title>
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css" />
    <script src="vendor/leaflet/leaflet.js"></script>
    <script type="importmap">{"imports": {
        "leaflet": "./vendor/maplibre-gl-leaflet/leaflet-global.mjs",
        "maplibre-gl": "./vendor/maplibre/maplibre-gl.mjs",
        "maplibre-gl-leaflet": "./vendor/maplibre-gl-leaflet/leaflet-maplibre-gl.mjs"
    }}</script>
    <!-- Defines window.maplibregl and L.maplibreGL before DOMContentLoaded,
         when the map is created. -->
    <script type="module" src="scripts/lib/maplibreGlobals.mjs"></script>
    <script src="../shared/mapProviders.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }
        #minimapContainer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 
                0 4px 16px rgba(0, 0, 0, 0.3),
                0 2px 4px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        #minimap {
            width: 100%;
            height: 100%;
            border-radius: 12px;
            transform-origin: center center;
            will-change: transform;
        }
        /* The map's background colour is the style's own (set from
           src/shared/mapProviders.js), so a map whose style cannot draw
           still shows routes on the usual background. */
        .leaflet-marker-icon {
            filter: none !important;
        }
        #mapCredit {
            position: absolute;
            right: 6px;
            bottom: 4px;
            z-index: 1000;
            font: 600 9px/1.2 Arial, sans-serif;
            color: rgba(255, 255, 255, 0.85);
            text-shadow: 0 0 2px rgba(0, 0, 0, 0.9);
            pointer-events: none;
        }
        /* Static export background: a plain square image, no frame. */
        .static-mode #minimapContainer {
            border-radius: 0;
            border: none;
            box-shadow: none;
        }
        .static-mode #minimap {
            border-radius: 0;
            transform: none !important;
        }
        .static-mode #mapCredit {
            display: none;
        }
        .arrow-marker-icon {
            background: transparent !important;
            border: none !important;
            will-change: transform;
            transition: none;
        }
        .arrow-marker-icon img {
            will-change: transform;
        }
    </style>
</head>
<body>
    <div id="minimapContainer">
        <div id="minimap"></div>
        <div id="mapCredit"></div>
    </div>
    
    <script>
        let map = null;
        let mapMarker = null;
        let mapPolyline = null;
        let tileLayer = null;
        let tileProviderId = (window.MapProviders && window.MapProviders.DEFAULT_PROVIDER_ID) || 'versatiles';
        let darkMode = false;
        // Called when the current map layer cannot draw (see buildTileLayer).
        let onMapFailure = null;
        
        // Arrow size as percentage of minimap size
        const ARROW_SIZE_PERCENT = 0.30;  // 18% of minimap width
        let arrowSize = 80;  // Will be calculated based on container size
        
        // Smoothing state
        let smoothedLat = null;
        let smoothedLon = null;
        let smoothedHeading = null;
        const POSITION_SMOOTHING = 0.3;
        const HEADING_SMOOTHING = 0.25;

        // Heading-up mode: map rotates, arrow always points up
        let currentMapBearing = 0;
        
        // Interpolation data
        let gpsData = [];
        const mapZoom = 17;
        
        // IPC setup
        let ipcRenderer;
        try {
            if (typeof require !== 'undefined') {
                ipcRenderer = require('electron').ipcRenderer;
            } else {
                ipcRenderer = { send: () => {}, on: () => {} };
            }
        } catch (err) {
            ipcRenderer = { send: () => {}, on: () => {} };
        }
        
        // Calculate arrow size based on container
        function calculateArrowSize() {
            const container = document.getElementById('minimapContainer');
            const size = Math.min(container.offsetWidth, container.offsetHeight);
            arrowSize = Math.round(size * ARROW_SIZE_PERCENT);
            console.log('[MINIMAP] Arrow size:', arrowSize, 'px (container:', size, 'px)');
            return arrowSize;
        }
        
        // Smooth step function
        function smoothstep(t) {
            return t * t * (3 - 2 * t);
        }
        
        // Catmull-Rom spline interpolation
        function catmullRom(p0, p1, p2, p3, t) {
            const t2 = t * t;
            const t3 = t2 * t;
            return 0.5 * (
                (2 * p1) +
                (-p0 + p2) * t +
                (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 +
                (-p0 + 3 * p1 - 3 * p2 + p3) * t3
            );
        }
        
        function normalizeAngle(angle) {
            while (angle > 180) angle -= 360;
            while (angle < -180) angle += 360;
            return angle;
        }
        
        function lerpAngle(a, b, t) {
            let delta = normalizeAngle(b - a);
            return a + delta * smoothstep(t);
        }
        
        function getInterpolatedPosition(timestampMs) {
            if (gpsData.length === 0) return null;
            if (gpsData.length === 1) {
                return { lat: gpsData[0].lat, lon: gpsData[0].lon, heading: gpsData[0].heading };
            }
            
            let idx = 0;
            for (let i = 0; i < gpsData.length - 1; i++) {
                if (timestampMs >= gpsData[i].t && timestampMs <= gpsData[i + 1].t) {
                    idx = i;
                    break;
                }
                if (timestampMs > gpsData[i + 1].t) {
                    idx = i + 1;
                }
            }
            
            if (timestampMs <= gpsData[0].t) {
                return { lat: gpsData[0].lat, lon: gpsData[0].lon, heading: gpsData[0].heading };
            }
            if (timestampMs >= gpsData[gpsData.length - 1].t) {
                const last = gpsData[gpsData.length - 1];
                return { lat: last.lat, lon: last.lon, heading: last.heading };
            }
            
            const i1 = idx;
            const i2 = Math.min(idx + 1, gpsData.length - 1);
            const i0 = Math.max(idx - 1, 0);
            const i3 = Math.min(idx + 2, gpsData.length - 1);
            
            const p0 = gpsData[i0];
            const p1 = gpsData[i1];
            const p2 = gpsData[i2];
            const p3 = gpsData[i3];
            
            const segmentDuration = p2.t - p1.t;
            const t = segmentDuration > 0 ? (timestampMs - p1.t) / segmentDuration : 0;
            const smoothT = smoothstep(t);
            
            const lat = catmullRom(p0.lat, p1.lat, p2.lat, p3.lat, smoothT);
            const lon = catmullRom(p0.lon, p1.lon, p2.lon, p3.lon, smoothT);
            const heading = lerpAngle(p1.heading, p2.heading, t);
            
            return { lat, lon, heading };
        }
        
        function applySmoothing(target, current, factor) {
            if (current === null) return target;
            return current + (target - current) * factor;
        }
        
        function applySmoothingAngle(target, current, factor) {
            if (current === null) return target;
            let delta = normalizeAngle(target - current);
            return current + delta * factor;
        }
        
        // Vector map from the shared provider registry (tiles.sentryusb.com)
        // — see src/shared/mapProviders.js. If the style cannot draw (no
        // WebGL, tile server outage) the map shows the style's background
        // colour with the route on top.
        function currentProvider() {
            return window.MapProviders ? window.MapProviders.getProvider(tileProviderId) : null;
        }

        function applyMapBackground() {
            const provider = currentProvider();
            if (!provider) return;
            document.getElementById('minimap').style.background =
                darkMode ? provider.darkBackgroundColor : provider.backgroundColor;
        }

        // MapLibre GL needs WebGL2.
        let webgl2Support;
        function webgl2Available() {
            if (webgl2Support === undefined) {
                try { webgl2Support = !!document.createElement('canvas').getContext('webgl2'); } catch (err) { webgl2Support = false; }
            }
            return webgl2Support;
        }

        function mapUnavailable(reason) {
            console.warn('[MINIMAP] Map unavailable (' + reason + ') — drawing the route on the map background');
            if (tileLayer && map) {
                try { map.removeLayer(tileLayer); } catch (err) { /* already gone */ }
            }
            tileLayer = null;
            document.getElementById('mapCredit').textContent = '';
            if (onMapFailure) onMapFailure(new Error(reason));
        }

        function buildTileLayer() {
            const provider = currentProvider();
            if (!provider) throw new Error('map provider registry did not load');
            if (typeof L.maplibreGL !== 'function' || !window.maplibregl) {
                throw new Error('MapLibre did not load');
            }
            if (!webgl2Available()) throw new Error('WebGL2 is not available');
            document.getElementById('mapCredit').textContent = provider.exportCredit || '';
            const layer = L.maplibreGL({
                style: darkMode ? provider.darkStyleUrl : provider.styleUrl,
                interactive: false,
                // Keep the last frame readable by capturePage.
                canvasContextAttributes: { preserveDrawingBuffer: true },
                fadeDuration: 0
            });
            layer.on('add', () => {
                const glMap = layer.getMaplibreMap();
                if (!glMap) return mapUnavailable('no GL map');
                // Leaflet is Web Mercator; the styles ask for a globe.
                glMap.on('style.load', () => glMap.setProjection({ type: 'mercator' }));
                let loaded = false;
                glMap.once('load', () => { loaded = true; });
                glMap.on('error', (e) => {
                    if (!loaded && tileLayer === layer) {
                        mapUnavailable((e && e.error && e.error.message) || 'style error');
                    }
                });
            });
            return layer;
        }

        function setTileProvider(providerId) {
            tileProviderId = window.MapProviders
                ? window.MapProviders.normalizeProviderId(providerId)
                : providerId;
            applyMapBackground();
            if (map) {
                if (tileLayer) map.removeLayer(tileLayer);
                tileLayer = null;
                try {
                    tileLayer = buildTileLayer();
                    tileLayer.addTo(map);
                } catch (err) {
                    // WebGL unavailable: MapLibre throws while constructing.
                    mapUnavailable(err.message);
                }
            }
        }

        function setDarkMode(enabled) {
            darkMode = !!enabled;
            document.getElementById('minimapContainer').classList.toggle('dark-mode', darkMode);
            applyMapBackground();
            const provider = currentProvider();
            if (provider && tileLayer && typeof tileLayer.getMaplibreMap === 'function') {
                const glMap = tileLayer.getMaplibreMap();
                if (glMap) glMap.setStyle(darkMode ? provider.darkStyleUrl : provider.styleUrl);
            }
        }

        // Static export background: draw the route area once at the given
        // Leaflet zoom (maplibre-gl-leaflet drives MapLibre at zoom - 1,
        // because MapLibre counts zoom in 512-px tiles and Leaflet in 256-px
        // tiles, so the ground scale matches the 256-px tile zoom). Resolves
        // once MapLibre is idle with every tile drawn; rejects if the style
        // cannot draw, so the export falls back to its plain dark panel.
        const STATIC_RENDER_TIMEOUT_MS = 30000;
        function renderStatic(opts) {
            return new Promise((resolve, reject) => {
                let done = false;
                const finish = (err, value) => {
                    if (done) return;
                    done = true;
                    clearTimeout(timer);
                    onMapFailure = null;
                    if (err) reject(err); else resolve(value);
                };
                const timer = setTimeout(() => finish(new Error('map did not finish drawing in time')), STATIC_RENDER_TIMEOUT_MS);
                onMapFailure = (err) => finish(err);

                if (!map) initMap();
                document.body.classList.add('static-mode');
                if (mapMarker) { map.removeLayer(mapMarker); mapMarker = null; }
                if (mapPolyline) { map.removeLayer(mapPolyline); mapPolyline = null; }
                darkMode = !!opts.dark;
                document.getElementById('minimapContainer').classList.toggle('dark-mode', darkMode);
                // Fractional zoom keeps the requested ground coverage when the
                // window is sized to the export instead of whole tiles.
                map.options.zoomSnap = 0;
                map.invalidateSize(false);
                map.setView(opts.center, opts.zoom, { animate: false });
                setTileProvider(opts.providerId);
                if (done) return;
                const glMap = tileLayer && tileLayer.getMaplibreMap ? tileLayer.getMaplibreMap() : null;
                if (!glMap) return finish(new Error('no GL map'));

                const capture = () => {
                    // Let the compositor present the final GL frame first.
                    requestAnimationFrame(() => requestAnimationFrame(() => {
                        const b = map.getBounds();
                        finish(null, {
                            ok: true,
                            zoom: map.getZoom(),
                            bounds: {
                                minLat: b.getSouth(),
                                maxLat: b.getNorth(),
                                minLon: b.getWest(),
                                maxLon: b.getEast()
                            }
                        });
                    }));
                };
                // MapLibre's 'idle' fires only once the style, every visible
                // tile and all placement are done. maplibre-gl-leaflet moves
                // the GL camera on the next frame, so start listening then.
                requestAnimationFrame(() => {
                    if (done) return;
                    if (glMap.loaded() && glMap.areTilesLoaded() && glMap.isStyleLoaded()) capture();
                    else glMap.once('idle', capture);
                });
            });
        }

        function initMap() {
            if (map) return;

            // Calculate arrow size before creating map
            calculateArrowSize();

            map = L.map('minimap', {
                zoomControl: false,
                attributionControl: false,
                dragging: false,
                touchZoom: false,
                scrollWheelZoom: false,
                doubleClickZoom: false,
                boxZoom: false,
                keyboard: false,
                fadeAnimation: false,
                zoomAnimation: false,
                markerZoomAnimation: false
            }).setView([0, 0], mapZoom);

            setTileProvider(tileProviderId);
        }
        
        // Subdivide a path using Catmull-Rom spline for smoother curves
        function smoothPath(coords, subdivisions = 4) {
            if (coords.length < 3) return coords;
            
            const result = [];
            
            for (let i = 0; i < coords.length - 1; i++) {
                const i0 = Math.max(i - 1, 0);
                const i1 = i;
                const i2 = i + 1;
                const i3 = Math.min(i + 2, coords.length - 1);
                
                const p0 = coords[i0];
                const p1 = coords[i1];
                const p2 = coords[i2];
                const p3 = coords[i3];
                
                for (let s = 0; s < subdivisions; s++) {
                    const t = s / subdivisions;
                    const lat = catmullRom(p0[0], p1[0], p2[0], p3[0], t);
                    const lon = catmullRom(p0[1], p1[1], p2[1], p3[1], t);
                    result.push([lat, lon]);
                }
            }
            
            // Add the final point
            result.push(coords[coords.length - 1]);
            
            return result;
        }
        
        function initMapPath(pathData) {
            if (!map || !pathData || !pathData.length) return;
            
            const validPath = pathData.filter(coord => {
                const [lat, lon] = coord;
                return lat !== undefined && lon !== undefined &&
                       Number.isFinite(lat) && Number.isFinite(lon) &&
                       !(Math.abs(lat) < 0.001 && Math.abs(lon) < 0.001);
            });
            
            if (validPath.length < 2) return;
            
            // Smooth the path with Catmull-Rom interpolation for a cleaner curve
            const smoothed = smoothPath(validPath, 8);
            
            mapPolyline = L.polyline(smoothed, {
                color: '#0072ff',
                weight: 5,
                opacity: 0.8,
                lineJoin: 'round',
                lineCap: 'round',
                smoothFactor: 0
            }).addTo(map);
            
            map.setView(validPath[0], mapZoom, { animate: false });
        }
        
        function setGpsData(data) {
            gpsData = data.filter(d => 
                d.lat !== undefined && d.lon !== undefined &&
                Number.isFinite(d.lat) && Number.isFinite(d.lon) &&
                !(Math.abs(d.lat) < 0.001 && Math.abs(d.lon) < 0.001)
            );
            smoothedLat = null;
            smoothedLon = null;
            smoothedHeading = null;
            console.log('[MINIMAP] Loaded', gpsData.length, 'GPS points for interpolation');
        }
        
        function updateMarker(lat, lon, heading) {
            if (!map) initMap();

            smoothedLat = applySmoothing(lat, smoothedLat, POSITION_SMOOTHING);
            smoothedLon = applySmoothing(lon, smoothedLon, POSITION_SMOOTHING);
            smoothedHeading = applySmoothingAngle(heading || 0, smoothedHeading, HEADING_SMOOTHING);

            const latlng = L.latLng(smoothedLat, smoothedLon);
            const halfArrow = Math.round(arrowSize / 2);

            // Heading-up mode: smooth the bearing transition
            const targetHeading = ((smoothedHeading % 360) + 360) % 360;
            let bearingDelta = targetHeading - (currentMapBearing % 360);
            if (bearingDelta > 180) bearingDelta -= 360;
            if (bearingDelta < -180) bearingDelta += 360;
            currentMapBearing += bearingDelta;

            // Rotate the map so heading is always "up"
            const minimapEl = document.getElementById('minimap');
            if (minimapEl) {
                minimapEl.style.transition = 'transform 0.15s ease-out';
                minimapEl.style.transform = 'rotate(' + (-currentMapBearing) + 'deg) scale(1.42)';
                minimapEl.style.transformOrigin = 'center center';
            }

            if (!mapMarker) {
                // Counter-rotate arrow by +bearing to cancel the map's -bearing rotation
                const arrowIcon = L.divIcon({
                    className: 'arrow-marker-icon',
                    html: '<img src="../../assets/arrow.png" style="width: ' + arrowSize + 'px; height: ' + arrowSize + 'px; transform: rotate(' + currentMapBearing + 'deg); transform-origin: center center; display: block;" />',
                    iconSize: [arrowSize, arrowSize],
                    iconAnchor: [halfArrow, halfArrow]
                });

                mapMarker = L.marker(latlng, { icon: arrowIcon }).addTo(map);
            } else {
                mapMarker.setLatLng(latlng);
                // Update arrow counter-rotation
                var iconEl = mapMarker._icon;
                if (iconEl) {
                    var img = iconEl.querySelector('img');
                    if (img) {
                        img.style.transform = 'rotate(' + currentMapBearing + 'deg)';
                    }
                }
            }

            map.setView(latlng, mapZoom, { animate: false });
        }
        
        function updateMarkerByTime(timestampMs) {
            const pos = getInterpolatedPosition(timestampMs);
            if (pos) {
                updateMarker(pos.lat, pos.lon, pos.heading);
            }
        }
        
        let isReady = false;

        // Resolve once the map shows the current view, so a captured frame
        // never has blank tiles. The export allows 3 s per frame; after one
        // wait times out (offline, slow tiles) later frames wait briefly
        // until tiles load in time again.
        const SETTLE_TIMEOUT_MS = 2000, SETTLE_TIMEOUT_DEGRADED_MS = 250;
        let settleTimeoutMs = SETTLE_TIMEOUT_MS;
        function whenMapSettled() {
            return new Promise((resolve) => {
                let done = false;
                const finish = (settled) => {
                    if (done) return;
                    done = true;
                    clearTimeout(timer);
                    settleTimeoutMs = settled ? SETTLE_TIMEOUT_MS : SETTLE_TIMEOUT_DEGRADED_MS;
                    requestAnimationFrame(() => resolve());
                };
                const timer = setTimeout(() => finish(false), settleTimeoutMs);
                const glMap = tileLayer && typeof tileLayer.getMaplibreMap === 'function'
                    ? tileLayer.getMaplibreMap() : null;
                // maplibre-gl-leaflet moves the GL camera on the next frame.
                requestAnimationFrame(() => {
                    if (glMap) {
                        if (glMap.loaded() && glMap.areTilesLoaded()) finish(true);
                        else glMap.once('idle', () => finish(true));
                    } else if (tileLayer && typeof tileLayer.isLoading === 'function' && tileLayer.isLoading()) {
                        tileLayer.once('load', () => finish(true));
                    } else {
                        finish(true);
                    }
                });
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            initMap();
            isReady = true;
            
            setTimeout(() => {
                if (ipcRenderer?.send) ipcRenderer.send('minimap:ready');
            }, 500);
        });
        
        if (ipcRenderer && ipcRenderer.on) {
            ipcRenderer.on('minimap:init', (event, pathData) => {
                console.log('Minimap received path:', pathData?.length || 0, 'points');
                initMapPath(pathData);
                setTimeout(() => {
                    if (ipcRenderer?.send) ipcRenderer.send('minimap:ready');
                }, 300);
            });
            
            ipcRenderer.on('minimap:setGpsData', (event, data) => {
                setGpsData(data);
                if (ipcRenderer?.send) ipcRenderer.send('minimap:ready');
            });
            
            ipcRenderer.on('minimap:setProvider', (event, providerId) => {
                console.log('[MINIMAP] Tile provider:', providerId);
                setTileProvider(providerId);
            });

            ipcRenderer.on('minimap:setDarkMode', (event, enabled) => {
                console.log('[MINIMAP] Dark mode:', enabled);
                setDarkMode(enabled);
                if (ipcRenderer?.send) ipcRenderer.send('minimap:ready');
            });
            
            ipcRenderer.on('minimap:renderStatic', (event, opts) => {
                console.log('[MINIMAP] Static background:', JSON.stringify(opts));
                renderStatic(opts).then(
                    (result) => ipcRenderer.send('minimap:staticRendered', result),
                    (err) => ipcRenderer.send('minimap:staticRendered', { ok: false, error: (err && err.message) || String(err) })
                );
            });

            ipcRenderer.on('minimap:updateByTime', (event, timestampMs) => {
                updateMarkerByTime(timestampMs);
                whenMapSettled().then(() => {
                    if (isReady && ipcRenderer?.send) ipcRenderer.send('minimap:ready');
                });
            });

            ipcRenderer.on('minimap:update', (event, lat, lon, heading) => {
                updateMarker(lat, lon, heading);
                whenMapSettled().then(() => {
                    if (isReady && ipcRenderer?.send) ipcRenderer.send('minimap:ready');
                });
            });
        }
    </script>
</body>
</html>
